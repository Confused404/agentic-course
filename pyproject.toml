[project]
name = "agentic-course"
version = "1.0.0"
description = "Agentic Engineering: a live-repo course. Shopfront (the app) + agentlab (the agents you build)."
requires-python = ">=3.12,<3.14"
# Versions pinned 2026-11-04. If an install fails later, see nodes/00-setup/README.md §"When versions drift".
dependencies = [
  "anthropic==2.4.0",
  "openai==3.45.0",
  "tiktoken==0.14.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sse-starlette==3.6.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "python-dotenv==1.2.4",
  "numpy==2.5.4",
  "opentelemetry-sdk==1.45.2",
  "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
# Installed by `make setup`. Split out so a broken heavy package never blocks Part I.
retrieval = ["fastembed==0.9.1"]
otlp = ["opentelemetry-exporter-otlp==1.45.2"]
mcp = ["mcp==2.3.0"]
frameworks = ["pydantic-ai==2.65.0", "langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3"]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shopfront", "agentlab"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib -m 'not live and not docker'"
markers = [
  "live: calls a real model API (costs money; needs keys). Run with: make eval",
  "docker: needs a running Docker daemon",
]
testpaths = ["shopfront/tests", "nodes"]
# Node 12's practice project, its hidden acceptance tests and the reference project are run by the harness against
# a workspace, never collected from here (they import `promo`, which only exists inside a workspace).
norecursedirs = [".*", "build", "dist", "*.egg", "venv", ".venv", "node_modules", "__pycache__", "project_template",
                 "acceptance", "reference_project"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
