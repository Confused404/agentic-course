# Node 17: how the support assistant runs in production. YOU edit this (YOU_DO tasks 5-6); the service reads it.

[assistant]
model = "fast"                        # an alias; wrapped in Node 14's ResilientModel
prompt = "v2"
tools = "v2"
max_turns = 8                         # model calls per customer message
budget_per_conversation_usd = 0.05    # hit it -> hand over to a person (TEXTBOOK §4), never a crash
handover_message = "I'm passing this to a colleague who can help. You'll hear from us within one business day."
max_message_chars = 4000              # longer messages are refused politely (one message must not eat the budget)

[rollout]
percent = 10                          # share of customers who get the assistant (stable per customer)
salt = "launch-2026-11"               # change it to reshuffle who's in
kill_switch = false                   # true -> every customer gets the handover message, the model is never called
                                      # (the service re-reads this file when it changes: no restart needed)

[auth]
audience = "shopfront-assistant"      # tokens must be issued for this audience (Node 13)
required_scopes = ["orders:read"]     # the minimum to talk to the assistant at all; tools still filter by scope
