# Knowledge-base QA (Node 07). Each question has:
#   gold: the documents that contain the answer (for retrieval metrics: recall@k, MRR, nDCG). Any ONE of them is
#         enough to answer unless the type is multi_hop or aggregate, where the answer needs several.
#   graders: on the final answer. answer_regex / answer_not_regex (case-insensitive, on normalised text);
#            abstains (the answer says it doesn't know / it isn't in the knowledge base); cites_any (cites one of
#            the listed doc ids as [doc-id]).
#   type: lookup · identifier (SKUs, codes) · paraphrase (the question shares few words with the answer) ·
#         stale (an ARCHIVED near-duplicate gives a different, wrong answer) · multi_hop · aggregate (needs many
#         documents) · unanswerable (the KB doesn't say).
# Archived traps: product-<SKU>-2024/-2025 (heavier, older warranties), warranty-2024, plus-membership-2024,
# help-returns-policy-2025.

