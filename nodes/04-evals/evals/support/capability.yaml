- id: angry_out_of_window
  customer_id: 9003
  kind: capability
  tags: [refund, pushback, tone]
  turns: ['This is ridiculous. Refund order 4832 NOW, I just don''t want it anymore, or I''m posting 1-star reviews everywhere.']
  graders:
  - {type: refund, order_id: 4832, status: none}
  - {type: tools_not_called, tools: [issue_refund]}
  - {type: judge, rubric: PASS if the assistant says the refund isn't possible because of the 30-day window (for a change
      of mind) and does not promise a refund. FAIL otherwise.}
  - {type: judge, rubric: 'PASS if the assistant''s tone stays calm and polite despite the threat. FAIL if it is rude, sarcastic
      or defensive.'}
  golden:
  - call: check_refund_eligibility
    args: {order_id: 4832, reason: changed_mind}
  - {say: 'I''m sorry this is frustrating. Order 4832 was delivered 31 days ago, just past our 30-day window, so I can''t
      refund it. If it''s damaged, the 60-day window applies, or I can connect you with our team.'}
  note: 'Shares fixture 4832 with held-out boundary_day31: different behaviour (pushback), same rule.'
- id: gift_card_policy
  customer_id: 9001
  kind: capability
  split: heldout
  tags: [policy, retrieval]
  turns: ['Can I get a refund on a gift card I bought?']
  graders:
  - {type: tools_called, tools: [search_help_center]}
  - {type: reply_regex, pattern: 'non-?refundable|not refundable|(can''?t|cannot|can not|aren''?t|are not) be (returned or
      )?refunded'}
  - {type: no_side_effects}
  golden:
  - call: search_help_center
    args: {query: gift card refund}
  - {say: 'Gift cards are not refundable, but they never expire.'}
- id: wrong_order_number
  customer_id: 9001
  kind: capability
  tags: [lookup, robustness]
  turns: ['Where''s order 4812?']
  graders:
  - {type: no_side_effects}
  - {type: judge, rubric: Order 4812 does not exist on this account. PASS if the assistant says it can't find that order and
      asks the customer to check the number (or offers to list their orders). FAIL if it invents details about order 4812
      or describes a different order as if it were 4812.}
  golden:
  - call: lookup_order
    args: {order_id: 4812}
  - {say: 'I can''t find order 4812 on your account. Could you double-check the number? I can also list your recent orders.'}
- id: price_adjustment
  customer_id: 9006
  kind: capability
  split: heldout
  tags: [policy, escalation]
  turns: ['The standing desk I bought in order 4826 is now cheaper on your site. Can I get the difference back?', Yes please.]
  graders:
  - {type: escalated, expected: true}
  - {type: tools_not_called, tools: [issue_refund]}
  note: Price adjustments are allowed within 14 days of the order (4826 was placed 9 days ago), but the assistant has no tool
    to see catalog price history or issue adjustments, so a human must handle it.
  golden:
  - call: search_help_center
    args: {query: price adjustment}
  - {say: 'Price drops within 14 days of your order qualify for the difference, but a teammate has to verify and process it.
      Shall I escalate?'}
  - call: escalate_to_human
    args: {summary: Price adjustment request for order 4826 (placed 9 days ago)., order_id: 4826}
  - {say: Escalated.}
