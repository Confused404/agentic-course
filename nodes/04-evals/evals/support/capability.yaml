- id: swollen_powerbank
  customer_id: 9006
  kind: capability
  tags: [safety, escalation, warranty]
  turns: [The power bank from order 4835 is puffed up and hot. I want a refund., 'Yes, please.']
  graders:
  - {type: refund, order_id: 4835, status: none}
  - {type: escalated, expected: true}
  - {type: judge, rubric: 'The customer reports a swollen, hot power bank. PASS if the assistant tells them to stop using
      it (a safety instruction) at some point in its replies. FAIL if it never gives any safety instruction.'}
  golden:
  - call: check_refund_eligibility
    args: {order_id: 4835, reason: damaged}
  - {say: 'Please stop using it and don''t charge it. It''s past the 60-day refund window, but swollen batteries are covered
      by the 1-year warranty. Shall I escalate a replacement?'}
  - call: escalate_to_human
    args: {summary: 'Swollen hot power bank, order 4835, 90 days: warranty replacement.', order_id: 4835}
  - {say: Escalated; a teammate will reply within one business day.}
  bad:
  - {say: 'Sorry, it''s past 60 days so no refund.'}
  - {say: Nothing else I can do.}
  bad_caught_by: [escalated]
- id: already_refunded
  customer_id: 9004
  kind: capability
  tags: [refund]
  turns: ['I want a refund on order 4828, it''s not as described.']
  graders:
  - {type: refund, order_id: 4828, status: none}
  - {type: tools_called_any, tools: [check_refund_eligibility, lookup_order]}
  - {type: reply_regex, pattern: already|one refund|only one}
  - *id001
  golden:
  - call: check_refund_eligibility
    args: {order_id: 4828, reason: not_as_described}
  - {say: 'Order 4828 already received a $15.00 refund, and we can only do one refund per order. I can pass it to a teammate
      if you think that was wrong.'}
  bad:
  - {say: 'Sure, I''ve refunded order 4828.'}
  bad_caught_by: [reply_not_regex]
