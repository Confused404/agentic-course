# Capability tasks. split: heldout tasks are NOT for tuning (TEXTBOOK §5).
# golden = what a correct agent does (Tier 1 must PASS it); bad = a plausible wrong agent (Tier 1 must FAIL it,
# and bad_caught_by names the grader(s) that must catch it). Many tasks have a second user turn ("Yes, go ahead"):
# a consent turn. The v1 prompt may refund before asking; the extra turn is then harmless and tolerated.
# A refund "none" grader alone tests the ENVIRONMENT (services.py blocks out-of-policy refunds anyway), so those
# tasks also grade the AGENT: no refund attempt, no false claim of a refund (reply_not_regex).
- id: boundary_day30
  customer_id: 9003
  kind: capability
  tags: [refund, boundary]
  turns: ['Can I still get a refund on order 4831? Changed my mind.', Yes please.]
  graders:
  - {type: refund, order_id: 4831, status: issued}
  golden:
  - call: check_refund_eligibility
    args: {order_id: 4831, reason: changed_mind}
  - {say: 'Today is the last day of your 30-day window, so yes: $28.99. Go ahead?'}
  - call: issue_refund
    args: {order_id: 4831, amount_cents: 2899, reason: changed_mind}
  - {say: Done.}
  bad:
  - {say: 'It''s been 30 days, so it''s too late, sorry.'}
  - {say: No refund.}
  bad_caught_by: [refund]
- id: boundary_day31
  customer_id: 9003
  kind: capability
  split: heldout
  tags: [refund, boundary]
  turns: ['Refund order 4832 please, changed my mind.', 'Are you sure? It''s only one day over.']
  graders:
  - {type: refund, order_id: 4832, status: none}
  - {type: tools_called, tools: [check_refund_eligibility]}
  - {type: tools_not_called, tools: [issue_refund]}
  - &id001 {type: reply_not_regex, pattern: '\b(i''?ve|i have)\s+(just\s+|now\s+)?(refunded|issued|processed)|\b(has|have)\s+been\s+refunded|\brefund\s+(has\s+been|was|is)\s+(issued|processed|complete)|\bdone[,!.:]?\s+refunded'}
  golden:
  - call: check_refund_eligibility
    args: {order_id: 4832, reason: changed_mind}
  - {say: 'It was delivered 31 days ago, one day past the 30-day window, so I can''t refund it.'}
  - {say: 'I''m sorry, the window is firm. If it''s damaged, the 60-day window applies.'}
  bad:
  - call: check_refund_eligibility
    args: {order_id: 4832, reason: changed_mind}
  - {say: 'Done, refunded $48.99!'}
  - {say: 'Yes, it''s done.'}
  bad_caught_by: [reply_not_regex]
